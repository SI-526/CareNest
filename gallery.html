<!DOCTYPE html>
<html lang="en" class="auth-pending">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CareNest — Gallery</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body data-page="gallery">
    <div class="app detail-app gallery-app">
      <nav class="primary-nav" aria-label="Primary navigation">
        <a class="nav-item" href="index.html#home">
          <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 9 7.5V21h-6v-6H9v6H3v-10.5L12 3Z" /></svg>
          <span>Home</span>
        </a>
        <a class="nav-item" href="index.html#schedule">
          <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 2a1 1 0 0 1 1 1v1h8V3a1 1 0 1 1 2 0v1h1a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h1V3a1 1 0 0 1 1-1Zm12 8H5v10h14V10ZM7 6H5v2h14V6h-2v1a1 1 0 1 1-2 0V6H8v1a1 1 0 1 1-2 0V6Z" /></svg>
          <span>Schedule</span>
        </a>
        <a class="nav-item" href="index.html#contacts">
          <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8Zm8-1a3 3 0 1 0 0-6 3 3 0 0 0 0 6ZM9 13c-3.87 0-7 2.24-7 5v3h14v-3c0-2.76-3.13-5-7-5Zm8.24.05c-.45-.03-.91-.05-1.38-.05a11.5 11.5 0 0 0-2.66.3c1.73.96 2.8 2.37 2.8 4V21H22v-3c0-2.42-2.1-4.47-4.76-4.95Z" /></svg>
          <span>Contacts</span>
        </a>
        <a class="nav-item" href="messages.html">
          <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 3h16a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H8.4L4.6 21.2A1 1 0 0 1 3 20.4V5a2 2 0 0 1 1-2Zm3 6a1.25 1.25 0 1 0 0 2.5A1.25 1.25 0 0 0 7 9Zm5 0a1.25 1.25 0 1 0 0 2.5A1.25 1.25 0 0 0 12 9Zm5 0a1.25 1.25 0 1 0 0 2.5A1.25 1.25 0 0 0 17 9Z" /></svg>
          <span>Messages</span>
        </a>
        <a class="nav-item" href="gallery.html" aria-current="page">
          <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M22 16V4a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2Zm-11-4 2.03 2.71L16 11l4 5H8l3-4ZM2 6v14a2 2 0 0 0 2 2h14v-2H4V6H2Z" /></svg>
          <span>Gallery</span>
        </a>
        <a class="nav-item" href="index.html#profile">
          <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10Zm0 2c-4.42 0-8 2.24-8 5v3h16v-3c0-2.76-3.58-5-8-5Z" /></svg>
          <span>Profile</span>
        </a>
      </nav>

      <main class="gallery-main" aria-labelledby="gallery-title">
        <div class="detail-nav">
          <h1 id="gallery-title">Gallery</h1>
        </div>

        <fieldset class="tag-picker gallery-filter">
          <legend class="visually-hidden">Show photos from</legend>
          <div class="tag-options">
            <label class="tag-option"><input type="radio" name="gallery-filter" value="all" checked /><span>All</span></label>
            <label class="tag-option"><input type="radio" name="gallery-filter" value="task" /><span>Task updates</span></label>
            <label class="tag-option"><input type="radio" name="gallery-filter" value="message" /><span>Photo messages</span></label>
            <label class="tag-option"><input type="radio" name="gallery-filter" value="moment" /><span>Moments</span></label>
          </div>
        </fieldset>

        <p class="locked-note" id="gallery-locked" hidden></p>
        <p class="gallery-status" id="gallery-status" role="status" aria-live="polite"></p>

        <div class="gallery-list" id="gallery-list"></div>

        <div class="gallery-add" id="gallery-add" hidden>
          <button type="button" class="gallery-fab" id="gallery-fab" aria-label="Add a photo" aria-describedby="gallery-locked">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5a1 1 0 1 1 2 0v6h6a1 1 0 1 1 0 2h-6v6a1 1 0 1 1-2 0v-6H5a1 1 0 1 1 0-2h6V5Z" /></svg>
          </button>
          <input type="file" accept="image/*" id="gallery-file" hidden />
        </div>
      </main>
    </div>

    <dialog class="confirm-dialog gallery-dialog" id="gallery-dialog" aria-labelledby="gallery-dialog-title">
      <form class="confirm-dialog-body" id="gallery-form" novalidate>
        <h2 class="complete-heading" id="gallery-dialog-title">Send a photo</h2>
        <div class="photo-preview-frame gallery-preview-frame">
          <img class="photo-preview" id="gallery-preview" alt="The photo you chose" />
        </div>
        <label class="complete-note-label" for="gallery-caption">Caption (optional)</label>
        <textarea class="complete-note" id="gallery-caption" maxlength="2000" rows="3"></textarea>
        <p class="photo-upload-error" id="gallery-error" role="alert" hidden></p>
        <div class="moment-dialog-actions">
          <button type="submit" class="primary-btn" id="gallery-send">Send</button>
          <button type="button" class="photo-source-btn" id="gallery-cancel">Cancel</button>
        </div>
      </form>
    </dialog>

    <p class="visually-hidden" id="app-status" aria-live="polite"></p>

    <script
      src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"
      integrity="sha384-Rj26LVGvoeRVR6+mwQmFfcR3QOBEwT+ZmuCWpuiqeTzJpCs0ER4ITAWGb4Hiy3Ok"
      crossorigin="anonymous"
    ></script>
    <script src="js/config.js"></script>
    <script src="js/supabase.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/data.js"></script>
    <script src="js/family-data.js"></script>
    <script src="js/store.js"></script>
    <script src="js/shift-data.js"></script>
    <script src="js/app.js"></script>
    <script src="js/gallery.js"></script>
  </body>
</html>
