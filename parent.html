<!DOCTYPE html>
<html lang="en" class="auth-pending">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CareNest — Today</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body data-page="parent">
    <div class="app detail-app parent-app">
      <nav class="primary-nav" aria-label="Parent navigation"></nav>

      <main class="parent-main" aria-labelledby="parent-title">
        <header class="parent-header">
          <img class="parent-child-avatar" id="parent-child-avatar" alt="" width="48" height="48" hidden />
          <div>
            <p class="parent-greeting" id="parent-greeting"></p>
            <h1 class="parent-title" id="parent-title" tabindex="-1"></h1>
          </div>
        </header>

        <div class="new-photo-banner" id="new-photo-banner" hidden>
          <p class="new-photo-text">
            <span id="new-photo-text"></span>
            <a class="new-photo-link" id="new-photo-link" href="#">View</a>
          </p>
          <button type="button" class="new-photo-dismiss" id="new-photo-dismiss" aria-label="Dismiss new photo alert">
            <span aria-hidden="true">&times;</span>
          </button>
        </div>

        <section class="panel day-status" id="day-status" aria-labelledby="day-status-heading">
          <h2 class="visually-hidden" id="day-status-heading">Shift status</h2>
          <div class="day-status-row">
            <div class="day-status-meta">
              <p class="day-status-title" id="day-status-title"></p>
              <p class="shift-status" id="day-status-detail"></p>
            </div>
            <span class="status-pill" id="day-status-pill"></span>
          </div>
          <div class="day-progress-row">
            <span class="day-progress-label" id="day-progress-label">Schedule</span>
            <span class="day-progress-count" id="day-progress-count"></span>
          </div>
          <progress class="day-progress" id="day-progress" max="1" value="0" aria-labelledby="day-progress-label day-progress-count"></progress>
          <div class="shift-actions parent-shift-actions">
            <button type="button" class="photo-source-btn shift-btn" id="parent-end-shift" hidden>End shift</button>
            <button type="button" class="photo-source-btn shift-btn" id="parent-reopen-shift" hidden>Reopen shift</button>
          </div>
          <p class="photo-upload-error" id="parent-error" role="alert" hidden></p>
        </section>

        <section class="panel day-notes-panel" id="important-today" aria-labelledby="day-notes-heading">
          <div class="panel-header">
            <div>
              <h2 class="panel-title" id="day-notes-heading">What’s important today</h2>
              <p class="day-notes-date" id="day-notes-date"></p>
            </div>
            <p class="day-notes-count" id="day-notes-count" hidden aria-live="polite"></p>
          </div>
          <ul class="day-notes-list" id="day-notes-list" hidden></ul>
          <p class="day-notes-status" id="day-notes-status">Loading today's notes…</p>
          <button type="button" class="primary-btn day-notes-add" id="day-notes-add" hidden>Add a note</button>
          <p class="form-error" id="day-notes-write-error" role="alert" hidden></p>
        </section>

        <section class="panel parent-schedule" id="parent-schedule" aria-labelledby="parent-schedule-heading">
          <h2 class="panel-title" id="parent-schedule-heading">Today's schedule</h2>
          <ul class="parent-task-list" id="parent-task-list"></ul>
        </section>

        <section class="panel parent-care-log" id="parent-care-log" aria-labelledby="parent-care-log-heading">
          <h2 class="panel-title" id="parent-care-log-heading">Care log</h2>
          <div id="parent-care-log-list"></div>
        </section>

        <section class="feed-section" aria-labelledby="feed-heading">
          <h2 class="panel-title" id="feed-heading">Photos</h2>
          <p class="feed-status" id="feed-status" hidden></p>
          <ol class="feed-list" id="feed-list"></ol>
          <div class="card empty-state" id="feed-empty" hidden><p></p></div>
        </section>
      </main>
    </div>

    <p class="visually-hidden" id="app-status" aria-live="polite"></p>

    <dialog class="confirm-dialog manage-dialog" id="day-note-dialog" aria-labelledby="day-note-dialog-title">
      <form class="confirm-dialog-body" id="day-note-form" novalidate>
        <h2 class="panel-title" id="day-note-dialog-title">Add a note</h2>
        <div class="manage-fields">
          <div class="manage-field">
            <label class="field-label" for="day-note-category">Type</label>
            <select class="text-input" id="day-note-category" name="category" required>
              <option value="routine">Routine change</option>
              <option value="instructions">Special instruction</option>
              <option value="schedule">Schedule change</option>
              <option value="food_meds">Food or medication</option>
              <option value="other">Other</option>
            </select>
          </div>
          <div class="manage-field">
            <label class="field-label" for="day-note-title">Title</label>
            <input class="text-input" id="day-note-title" name="title" type="text" maxlength="140" required autocomplete="off" />
          </div>
          <div class="manage-field">
            <label class="field-label" for="day-note-detail">Details <span class="field-optional">(optional)</span></label>
            <textarea class="text-input manage-textarea" id="day-note-detail" name="detail" rows="3" maxlength="2000"></textarea>
          </div>
        </div>
        <p class="form-error" id="day-note-error" role="alert" hidden></p>
        <div class="moment-dialog-actions">
          <button type="submit" class="primary-btn" id="day-note-save">Save</button>
          <button type="button" class="photo-source-btn" id="day-note-cancel">Cancel</button>
        </div>
      </form>
    </dialog>

    <script
      src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"
      integrity="sha384-Rj26LVGvoeRVR6+mwQmFfcR3QOBEwT+ZmuCWpuiqeTzJpCs0ER4ITAWGb4Hiy3Ok"
      crossorigin="anonymous"
    ></script>
    <script src="js/config.js"></script>
    <script src="js/supabase.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/data.js"></script>
    <script src="js/family-data.js"></script>
    <script src="js/store.js"></script>
    <script src="js/care-log.js"></script>
    <script src="js/shift-data.js"></script>
    <script src="js/app.js"></script>
    <script src="js/parent.js"></script>
  </body>
</html>
