<!DOCTYPE html>
<html lang="en" class="auth-pending">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
    <title>CareNest — Create your family space</title>
  </head>
  <body data-page="onboarding">
    <div class="app auth-app">
      <header class="auth-header"><a class="auth-brand" href="signin.html">CareNest</a></header>
      <main class="auth-main" aria-labelledby="onboarding-title">
        <section class="auth-intro">
          <h1 class="auth-title" id="onboarding-title">Create your family space</h1>
          <p class="auth-lede">
            You'll be its parent. After this you can invite your sitter by email.
            Signed in as <strong id="onboarding-email"></strong>.
            <button type="button" class="text-btn" id="onboarding-signout">Use a different account</button>
          </p>
          <p class="signin-note">
            Are you a sitter? Don't create a family space. Open the invite link the family sent you instead.
          </p>
        </section>
        <div id="risk-notice"></div>
        <form class="card auth-card" id="onboarding-form" novalidate>
          <label class="field-label" for="household-name">Family space name</label>
          <input class="text-input" id="household-name" name="household_name" type="text" maxlength="80" required placeholder="The Thomas family" autocomplete="off" />
          <label class="field-label" for="child-name">Child's name <span class="field-optional">(optional)</span></label>
          <input class="text-input" id="child-name" name="child_name" type="text" maxlength="80" autocomplete="off" />
          <label class="field-label" for="child-age">Child's age <span class="field-optional">(optional, e.g. "Age 3")</span></label>
          <input class="text-input" id="child-age" name="child_age_label" type="text" maxlength="40" autocomplete="off" />
          <label class="check-row">
            <input type="checkbox" id="risk-ack" name="acknowledged" required />
            <span>I have read the notice above. I understand CareNest is a student project, not HIPAA-compliant and not a medical service, with no backups, and I enter real information at my own risk.</span>
          </label>
          <button type="submit" class="primary-btn" id="onboarding-submit">Create family space</button>
          <p class="form-error" id="onboarding-error" role="alert" hidden></p>
        </form>
      </main>
      <footer class="legal-footer"><a href="privacy.html">Privacy</a><span aria-hidden="true">·</span><a href="terms.html">Terms</a></footer>
    </div>
    <script
      src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"
      integrity="sha384-Rj26LVGvoeRVR6+mwQmFfcR3QOBEwT+ZmuCWpuiqeTzJpCs0ER4ITAWGb4Hiy3Ok"
      crossorigin="anonymous"
    ></script>
    <script src="js/config.js"></script>
    <script src="js/supabase.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/onboarding.js"></script>
  </body>
</html>
