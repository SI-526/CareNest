      <nav class="primary-nav" aria-label="Primary navigation">

        <a class="nav-item" href="gallery.html">

          <span>Profile</span>
        </a>
      </nav>

      <main class="messages-main" aria-labelledby="messages-title">
        <div class="detail-nav">
          <h1 id="messages-title">Messages</h1>
        </div>

        <p class="locked-note" id="messages-locked" hidden>
          This shift has ended. Photos can't be added after a shift. You can still read and send messages.
        </p>

        <ol class="message-list" id="message-list" aria-label="Message thread"></ol>

        <form class="message-form" id="message-form" novalidate>
          <label class="visually-hidden" for="message-input">Message</label>
          <input
            class="complete-note message-input"
            id="message-input"
            type="text"
            maxlength="1000"
            autocomplete="off"
            enterkeyhint="send"
          />
          <button type="submit" class="primary-btn message-send">Send</button>
          <p class="photo-upload-error message-error" id="message-error" role="alert" hidden></p>
        </form>
      </main>
    </div>

    <p class="visually-hidden" id="app-status" aria-live="polite"></p>

    <script
      src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"
      integrity="sha384-Rj26LVGvoeRVR6+mwQmFfcR3QOBEwT+ZmuCWpuiqeTzJpCs0ER4ITAWGb4Hiy3Ok"
      crossorigin="anonymous"
    ></script>
    <script src="js/config.js"></script>
    <script src="js/supabase.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/data.js"></script>
    <script src="js/family-data.js"></script>
    <script src="js/store.js"></script>
    <script src="js/shift-data.js"></script>
    <script src="js/app.js"></script>
    <script src="js/moment.js"></script>
  </body>
</html>
